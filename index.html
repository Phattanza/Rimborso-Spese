<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionale Rimborso Spese</title>
  
  <!-- Icone Schermata Home -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2845/2845570.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2845/2845570.png">

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-6 font-sans antialiased text-gray-800">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-xl font-bold text-gray-900">Gestionale Spese Trasferte</h1>
        <p class="text-xs text-gray-500 mt-0.5">Traccia chilometri e rimborsi aziendali</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="loadDataFromCloud()" class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 font-medium px-3.5 py-2 rounded-xl text-xs transition flex items-center gap-1">
          🔄 Sync
        </button>
        <button onclick="openTripModal()" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold px-4 py-2 rounded-xl text-sm transition shadow-sm">
          + Nuova Trasferta
        </button>
      </div>
    </div>
    
    <!-- Totale Generale Da Rimborsare -->
    <div class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white p-6 rounded-2xl shadow-md flex justify-between items-center">
      <div>
        <span class="text-xs uppercase font-semibold text-blue-200 tracking-wider">Totale Generale Da Rimborsare</span>
        <h2 id="grand-total" class="text-3xl sm:text-4xl font-black mt-1">€ 0.00</h2>
      </div>
      <div class="text-right">
        <span id="trip-count" class="text-xs font-medium text-blue-200 block">0 Trasferte</span>
        <div id="sync-status" class="text-[10px] text-blue-300 mt-1 font-mono">Inizializzazione...</div>
      </div>
    </div>

    <!-- Contenitore Trasferte -->
    <div id="trips-container" class="space-y-6"></div>
  </div>

  <!-- MODALE CREA TRASFERTA -->
  <div id="trip-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4">
      <h3 class="text-lg font-bold text-gray-900">Crea Nuova Trasferta</h3>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nome Trasferta / Periodo</label>
        <input type="text" id="trip-title-input" placeholder="es. Trasferta Milano / Settimana 36" class="w-full border border-gray-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeTripModal()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-xl transition">Annulla</button>
        <button onclick="saveTripFromModal()" class="px-4 py-2 text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm transition">Crea Trasferta</button>
      </div>
    </div>
  </div>

  <!-- MODALE MODIFICA SPESA -->
  <div id="edit-expense-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4">
      <h3 class="text-lg font-bold text-gray-900">Modifica Spesa</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Data</label>
          <input type="date" id="edit-expense-date" onclick="triggerDatePicker(this)" class="w-full border border-gray-300 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white cursor-pointer">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Descrizione / Tratta</label>
          <input type="text" id="edit-expense-name" placeholder="Descrizione spesa" class="w-full border border-gray-300 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Importo €</label>
          <input type="number" step="0.01" id="edit-expense-amount" placeholder="0.00" class="w-full border border-gray-300 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeEditExpenseModal()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-xl transition">Annulla</button>
        <button onclick="saveExpenseEdit()" class="px-4 py-2 text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm transition">Salva Modifiche</button>
      </div>
    </div>
  </div>

  <script>
    // CONFIGURAZIONE DATABASE CLOUD (JSONBin.io)
    const JSONBIN_BIN_ID = "6a9d97fbda38895dfe405d1b";
    const JSONBIN_API_KEY = "$2a$10$q23.QIS.SieOcelJfYM/6ukMPOcQNjeq1rEjrbtMSA9yQMtRI1jyW";

    let data = [];
    let currentFilter = {};
    let editingState = { tripId: null, expenseId: null };

    function formatDateToDisplay(isoDateStr) {
      if (!isoDateStr) return '';
      const parts = isoDateStr.split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return isoDateStr;
    }

    function getTodayISO() {
      return new Date().toISOString().split('T')[0];
    }

    async function loadDataFromCloud() {
      updateSyncStatus("Sincronizzazione...");
      if (!JSONBIN_BIN_ID || JSONBIN_BIN_ID === "IL_TUO_BIN_ID") {
        data = JSON.parse(localStorage.getItem('rimborsi')) || [];
        updateSyncStatus("Modalità Locale");
        render();
        return;
      }

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const json = await res.json();
        
        let record = json.record;
        if (record && record.rimborsi && Array.isArray(record.rimborsi)) {
          data = record.rimborsi;
        } else if (Array.isArray(record)) {
          data = record;
        } else {
          data = [];
        }

        const localData = JSON.parse(localStorage.getItem('rimborsi')) || [];
        if (data.length === 0 && localData.length > 0) {
          data = localData;
          await saveData();
        } else {
          localStorage.setItem('rimborsi', JSON.stringify(data));
        }

        updateSyncStatus("Sincronizzato ✓");
        render();
      } catch (err) {
        console.error("Errore cloud:", err);
        data = JSON.parse(localStorage.getItem('rimborsi')) || [];
        updateSyncStatus("Errore Sync (Dati Locali)");
        render();
      }
    }

    async function saveData() {
      localStorage.setItem('rimborsi', JSON.stringify(data));
      render();

      if (JSONBIN_BIN_ID && JSONBIN_BIN_ID !== "IL_TUO_BIN_ID") {
        updateSyncStatus("Salvataggio Cloud...");
        try {
          await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': JSONBIN_API_KEY
            },
            body: JSON.stringify({ rimborsi: data })
          });
          updateSyncStatus("Sincronizzato ✓");
        } catch (err) {
          console.error("Errore salvataggio:", err);
          updateSyncStatus("Errore Salvataggio");
        }
      }
    }

    function updateSyncStatus(msg) {
      document.getElementById('sync-status').innerText = msg;
    }

    function openTripModal() {
      document.getElementById('trip-title-input').value = '';
      document.getElementById('trip-modal').classList.remove('hidden');
      document.getElementById('trip-modal').classList.add('flex');
    }

    function closeTripModal() {
      document.getElementById('trip-modal').classList.add('hidden');
      document.getElementById('trip-modal').classList.remove('flex');
    }

    function saveTripFromModal() {
      const title = document.getElementById('trip-title-input').value.trim();
      if (title) {
        data.push({ id: Date.now(), title: title, expenses: [] });
        saveData();
        closeTripModal();
      }
    }

    function deleteTrip(tripId) {
      if (confirm("Vuoi davvero eliminare questa trasferta e tutte le sue spese?")) {
        data = data.filter(t => t.id !== tripId);
        saveData();
      }
    }

    function triggerDatePicker(inputElem) {
      if ('showPicker' in HTMLInputElement.prototype) {
        try {
          inputElem.showPicker();
        } catch (e) {
          inputElem.focus();
        }
      } else {
        inputElem.focus();
      }
    }

    function addInlineExpense(tripId) {
      const dateVal = document.getElementById(`inline-date-${tripId}`).value;
      const nameVal = document.getElementById(`inline-name-${tripId}`).value.trim();
      const amountVal = parseFloat(document.getElementById(`inline-amount-${tripId}`).value);

      if (!nameVal) {
        alert("Inserisci una descrizione o tratta per la spesa.");
        return;
      }
      if (isNaN(amountVal) || amountVal <= 0) {
        alert("Inserisci un importo valido.");
        return;
      }

      const trip = data.find(t => t.id === tripId);
      if (trip) {
        trip.expenses.push({ 
          id: Date.now(), 
          date: dateVal || getTodayISO(), 
          name: nameVal, 
          amount: amountVal, 
          paid: false 
        });
        saveData();
      }
    }

    // MODIFICA SPESA
    function openEditExpenseModal(tripId, expenseId) {
      const trip = data.find(t => t.id === tripId);
      if (!trip) return;
      const expense = trip.expenses.find(e => e.id === expenseId);
      if (!expense) return;

      editingState = { tripId, expenseId };
      document.getElementById('edit-expense-date').value = expense.date || getTodayISO();
      document.getElementById('edit-expense-name').value = expense.name || '';
      document.getElementById('edit-expense-amount').value = expense.amount || '';

      document.getElementById('edit-expense-modal').classList.remove('hidden');
      document.getElementById('edit-expense-modal').classList.add('flex');
    }

    function closeEditExpenseModal() {
      editingState = { tripId: null, expenseId: null };
      document.getElementById('edit-expense-modal').classList.add('hidden');
      document.getElementById('edit-expense-modal').classList.remove('flex');
    }

    function saveExpenseEdit() {
      const { tripId, expenseId } = editingState;
      if (!tripId || !expenseId) return;

      const dateVal = document.getElementById('edit-expense-date').value;
      const nameVal = document.getElementById('edit-expense-name').value.trim();
      const amountVal = parseFloat(document.getElementById('edit-expense-amount').value);

      if (!nameVal) {
        alert("Inserisci una descrizione o tratta per la spesa.");
        return;
      }
      if (isNaN(amountVal) || amountVal <= 0) {
        alert("Inserisci un importo valido.");
        return;
      }

      const trip = data.find(t => t.id === tripId);
      if (trip) {
        const expense = trip.expenses.find(e => e.id === expenseId);
        if (expense) {
          expense.date = dateVal || getTodayISO();
          expense.name = nameVal;
          expense.amount = amountVal;
          saveData();
          closeEditExpenseModal();
        }
      }
    }

    function togglePaid(tripId, expenseId) {
      const trip = data.find(t => t.id === tripId);
      if (trip) {
        const expense = trip.expenses.find(e => e.id === expenseId);
        if (expense) {
          expense.paid = !expense.paid;
          saveData();
        }
      }
    }

    function deleteExpense(tripId, expenseId) {
      const trip = data.find(t => t.id === tripId);
      if (trip) {
        trip.expenses = trip.expenses.filter(e => e.id !== expenseId);
        saveData();
      }
    }

    function setFilter(tripId, filterType) {
      currentFilter[tripId] = filterType;
      render();
    }

    function render() {
      const container = document.getElementById('trips-container');
      container.innerHTML = '';
      let grandTotal = 0;

      data.forEach(trip => {
        const pendingExpenses = trip.expenses.filter(e => !e.paid);
        const tripTotal = pendingExpenses.reduce((s, e) => s + e.amount, 0);
        grandTotal += tripTotal;

        trip.expenses.sort((a, b) => (a.date || '').localeCompare(b.date || ''));

        const filter = currentFilter[trip.id] || 'all';
        let visibleExpenses = trip.expenses;
        if (filter === 'pending') visibleExpenses = trip.expenses.filter(e => !e.paid);
        if (filter === 'paid') visibleExpenses = trip.expenses.filter(e => e.paid);

        const tripEl = document.createElement('div');
        tripEl.className = 'bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden';

        let listHtml = '';
        if (visibleExpenses.length === 0) {
          listHtml = '<p class="text-gray-400 text-xs italic p-4 text-center">Nessuna spesa inserita.</p>';
        } else {
          listHtml = `
            <ul class="divide-y divide-gray-100 text-sm">
              ${visibleExpenses.map(e => `
                <li class="p-3.5 flex justify-between items-center gap-3 transition ${e.paid ? 'bg-gray-50/70 opacity-60' : 'hover:bg-gray-50/50'}">
                  <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-3 overflow-hidden">
                    <span class="text-xs text-gray-500 font-mono shrink-0 bg-gray-100 px-2 py-0.5 rounded-md">${formatDateToDisplay(e.date)}</span>
                    <span class="${e.paid ? 'line-through text-gray-500' : 'text-gray-900 font-medium'} truncate">${e.name}</span>
                  </div>
                  <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
                    <b class="${e.paid ? 'text-gray-400 line-through' : 'text-gray-900'} text-base mr-1">€ ${e.amount.toFixed(2)}</b>
                    
                    <button onclick="togglePaid(${trip.id}, ${e.id})" 
                      class="text-xs font-semibold px-2.5 py-1 rounded-lg transition ${
                        e.paid 
                          ? 'bg-green-100 text-green-700 hover:bg-green-200' 
                          : 'bg-amber-100 text-amber-800 hover:bg-amber-200'
                      }">
                      ${e.paid ? '✓ Pagato' : '⏳ Da Saldare'}
                    </button>

                    <button onclick="openEditExpenseModal(${trip.id}, ${e.id})" title="Modifica spesa" class="text-gray-400 hover:text-blue-600 hover:bg-blue-50 p-1.5 rounded-lg transition text-sm">✏️</button>

                    <button onclick="deleteExpense(${trip.id}, ${e.id})" title="Elimina spesa" class="text-gray-400 hover:text-red-600 hover:bg-red-50 p-1 rounded-lg transition text-lg leading-none">&times;</button>
                  </div>
                </li>
              `).join('')}
            </ul>
          `;
        }

        tripEl.innerHTML = `
          <!-- Header Trasferta -->
          <div class="bg-gray-900 text-white p-4 flex justify-between items-center">
            <h3 class="font-bold text-base tracking-wide">${trip.title}</h3>
            <button onclick="deleteTrip(${trip.id})" class="text-xs bg-red-500/20 hover:bg-red-600 text-red-200 hover:text-white px-2.5 py-1 rounded-lg transition">Elimina</button>
          </div>
          
          <div class="p-4 space-y-4">
            
            <!-- Filtri Stato Spese -->
            <div class="flex justify-between items-center text-xs border-b border-gray-100 pb-2 flex-wrap gap-2">
              <div class="flex gap-1 bg-gray-100 p-1 rounded-xl">
                <button onclick="setFilter(${trip.id}, 'all')" class="px-2.5 py-1 rounded-lg font-medium transition ${filter === 'all' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500'}">Tutte (${trip.expenses.length})</button>
                <button onclick="setFilter(${trip.id}, 'pending')" class="px-2.5 py-1 rounded-lg font-medium transition ${filter === 'pending' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500'}">Da Saldare (${pendingExpenses.length})</button>
                <button onclick="setFilter(${trip.id}, 'paid')" class="px-2.5 py-1 rounded-lg font-medium transition ${filter === 'paid' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500'}">Pagate (${trip.expenses.length - pendingExpenses.length})</button>
              </div>
              <div>
                <span class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Da Rimborsare: </span>
                <span class="text-base font-extrabold text-blue-600">€ ${tripTotal.toFixed(2)}</span>
              </div>
            </div>

            <!-- Lista Spese Registrate -->
            ${listHtml}

            <!-- MODULO INTEGRATO CON CAMPO DATA RIDIMENSIONATO CORRETTAMENTE -->
            <div class="bg-gray-50 p-3 rounded-2xl border border-gray-200/80 space-y-2 mt-2">
              <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block px-1">Aggiungi nuova spesa / tratta</span>
              <div class="flex flex-col sm:flex-row gap-2">
                <input type="date" id="inline-date-${trip.id}" value="${getTodayISO()}" onclick="triggerDatePicker(this)" class="w-full sm:w-36 border border-gray-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white cursor-pointer shrink-0">
                <input type="text" id="inline-name-${trip.id}" placeholder="Tratta o descrizione (es. Limbiate-Sede 80km)" class="flex-1 min-w-0 border border-gray-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                <input type="number" step="0.01" id="inline-amount-${trip.id}" placeholder="Importo €" class="w-full sm:w-28 border border-gray-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white shrink-0">
                <button onclick="addInlineExpense(${trip.id})" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold text-xs px-4 py-2 rounded-xl transition shadow-sm shrink-0">
                  + Salva
                </button>
              </div>
            </div>

          </div>
        `;

        container.appendChild(tripEl);
      });

      document.getElementById('grand-total').innerText = '€ ' + grandTotal.toFixed(2);
      document.getElementById('trip-count').innerText = data.length + ' Trasferte';
    }

    window.addEventListener('focus', () => {
      loadDataFromCloud();
    });

    loadDataFromCloud();
  </script>
</body>
</html>
