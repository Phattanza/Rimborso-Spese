<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionale Rimborso Spese</title>
  
  <!-- Icone per Schermata Home del telefono -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2845/2845570.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2845/2845570.png">

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 sm:p-6 font-sans">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="bg-white p-6 rounded-xl shadow flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-xl font-bold text-gray-800">Gestionale Spese Trasferte</h1>
        <p class="text-xs text-gray-500">Traccia le spese e i rimborsi aziendali (Sincronizzato Cloud)</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="loadDataFromCloud()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-3 py-2 rounded-lg text-xs transition" title="Aggiorna dati">
          🔄 Ricarica
        </button>
        <button onclick="addTrip()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition">
          + Nuova Trasferta
        </button>
      </div>
    </div>
    
    <!-- Totale Generale Da Rimborsare -->
    <div class="bg-blue-900 text-white p-6 rounded-xl shadow flex justify-between items-center">
      <div>
        <span class="text-xs uppercase font-semibold opacity-80 tracking-wider">Totale Generale Da Rimborsare</span>
        <h2 id="grand-total" class="text-3xl font-extrabold mt-1">€ 0.00</h2>
      </div>
      <div class="text-right">
        <span id="trip-count" class="text-xs opacity-80">0 Trasferte</span>
        <div id="sync-status" class="text-[10px] opacity-70 mt-1">Inizializzazione...</div>
      </div>
    </div>

    <!-- Contenitore Trasferte -->
    <div id="trips-container" class="space-y-6"></div>
  </div>

  <script>
    // CONFIGURAZIONE DATABASE CLOUD (JSONBin.io)
    const JSONBIN_BIN_ID = "IL_TUO_BIN_ID";
    const JSONBIN_API_KEY = "LA_TUA_API_KEY";

    let data = [];

    // Carica dati dal Cloud all'avvio
    async function loadDataFromCloud() {
      updateSyncStatus("Sincronizzazione in corso...");
      if (!JSONBIN_BIN_ID || JSONBIN_BIN_ID === "IL_TUO_BIN_ID") {
        data = JSON.parse(localStorage.getItem('rimborsi')) || [];
        updateSyncStatus("Modalità Locale (Configura Cloud)");
        render();
        return;
      }

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const json = await res.json();
        
        // Estrazione flessibile dati (supporta sia array sia oggetto { rimborsi: [...] })
        let record = json.record;
        if (record && record.rimborsi && Array.isArray(record.rimborsi)) {
          data = record.rimborsi;
        } else if (Array.isArray(record)) {
          data = record;
        } else {
          data = [];
        }

        // Se il Cloud è ancora vuoto ma c'erano dati salvati in locale, sincronizza i dati locali sul Cloud
        const localData = JSON.parse(localStorage.getItem('rimborsi')) || [];
        if (data.length === 0 && localData.length > 0) {
          data = localData;
          await saveData();
        } else {
          localStorage.setItem('rimborsi', JSON.stringify(data));
        }

        updateSyncStatus("Sincronizzato ✓");
        render();
      } catch (err) {
        console.error("Errore caricamento cloud:", err);
        data = JSON.parse(localStorage.getItem('rimborsi')) || [];
        updateSyncStatus("Errore Sync (Uso dati locali)");
        render();
      }
    }

    // Salva dati sia in locale che sul Cloud
    async function saveData() {
      localStorage.setItem('rimborsi', JSON.stringify(data));
      render();

      if (JSONBIN_BIN_ID && JSONBIN_BIN_ID !== "IL_TUO_BIN_ID") {
        updateSyncStatus("Salvataggio Cloud...");
        try {
          await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': JSONBIN_API_KEY
            },
            body: JSON.stringify({ rimborsi: data })
          });
          updateSyncStatus("Sincronizzato ✓");
        } catch (err) {
          console.error("Errore salvataggio cloud:", err);
          updateSyncStatus("Errore Salvataggio Cloud");
        }
      }
    }

    function updateSyncStatus(msg) {
      document.getElementById('sync-status').innerText = msg;
    }

    function addTrip() {
      const title = prompt("Nome della Trasferta (es. Trasferta Milano):");
      if (title && title.trim() !== "") {
        data.push({ id: Date.now(), title: title.trim(), expenses: [] });
        saveData();
      }
    }

    function deleteTrip(tripId) {
      if (confirm("Vuoi davvero eliminare questa trasferta e tutte le sue spese?")) {
        data = data.filter(t => t.id !== tripId);
        saveData();
      }
    }

    function parseDate(dateStr) {
      if (!dateStr) return new Date(0);
      const parts = dateStr.split('/');
      if (parts.length === 3) {
        return new Date(parts[2], parts[1] - 1, parts[0]);
      }
      return new Date(0);
    }

    function addExpense(tripId) {
      const name = prompt("Descrizione Spesa (es. Pranzo, Treno, Hotel):");
      if (!name || name.trim() === "") return;
      
      const amountStr = prompt("Importo (€):");
      const amount = parseFloat(amountStr ? amountStr.replace(',', '.') : 0);
      if (isNaN(amount) || amount <= 0) {
        alert("Inserisci un importo valido.");
        return;
      }

      const today = new Date();
      const defaultDate = String(today.getDate()).padStart(2, '0') + '/' + String(today.getMonth() + 1).padStart(2, '0') + '/' + today.getFullYear();
      
      const dateStr = prompt("Data della spesa (GG/MM/AAAA):", defaultDate);
      const date = dateStr && dateStr.trim() !== "" ? dateStr.trim() : defaultDate;

      const trip = data.find(t => t.id === tripId);
      if (trip) {
        trip.expenses.push({ id: Date.now(), date: date, name: name.trim(), amount: amount, paid: false });
        saveData();
      }
    }

    function togglePaid(tripId, expenseId) {
      const trip = data.find(t => t.id === tripId);
      if (trip) {
        const expense = trip.expenses.find(e => e.id === expenseId);
        if (expense) {
          expense.paid = !expense.paid;
          saveData();
        }
      }
    }

    function deleteExpense(tripId, expenseId) {
      if (confirm("Vuoi eliminare questa singola spesa?")) {
        const trip = data.find(t => t.id === tripId);
        if (trip) {
          trip.expenses = trip.expenses.filter(e => e.id !== expenseId);
          saveData();
        }
      }
    }

    function render() {
      const container = document.getElementById('trips-container');
      container.innerHTML = '';
      let grandTotal = 0;

      data.forEach(trip => {
        const pendingExpenses = trip.expenses.filter(e => !e.paid);
        const tripTotal = pendingExpenses.reduce((s, e) => s + e.amount, 0);
        grandTotal += tripTotal;

        trip.expenses.sort((a, b) => parseDate(a.date) - parseDate(b.date));

        const tripEl = document.createElement('div');
        tripEl.className = 'bg-white rounded-xl shadow border border-gray-200 overflow-hidden';

        let listHtml = '';
        if (trip.expenses.length === 0) {
          listHtml = '<p class="text-gray-400 text-xs italic p-3">Nessuna spesa inserita.</p>';
        } else {
          listHtml = `
            <ul class="divide-y divide-gray-100 text-sm">
              ${trip.expenses.map(e => `
                <li class="p-3 flex justify-between items-center gap-2 ${e.paid ? 'bg-gray-50' : ''}">
                  <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-3 overflow-hidden">
                    <span class="text-xs text-gray-400 font-mono shrink-0">${e.date || ''}</span>
                    <span class="${e.paid ? 'line-through text-gray-400' : 'text-gray-800 font-medium'} truncate">${e.name}</span>
                  </div>
                  <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                    <b class="${e.paid ? 'text-gray-400 line-through' : 'text-gray-900'}">€ ${e.amount.toFixed(2)}</b>
                    
                    <button onclick="togglePaid(${trip.id}, ${e.id})" 
                      class="text-xs font-semibold px-2 py-1 rounded transition ${
                        e.paid 
                          ? 'bg-green-100 text-green-700 border border-green-300' 
                          : 'bg-yellow-100 text-yellow-800 border border-yellow-300'
                      }">
                      ${e.paid ? '✓ Pagato' : '⏳ Non Pagato'}
                    </button>

                    <button onclick="deleteExpense(${trip.id}, ${e.id})" title="Elimina spesa" class="text-red-500 hover:text-red-700 hover:bg-red-50 font-bold text-base px-2 py-0.5 rounded transition">&times;</button>
                  </div>
                </li>
              `).join('')}
            </ul>
          `;
        }

        tripEl.innerHTML = `
          <div class="bg-gray-800 text-white p-3.5 flex justify-between items-center">
            <h3 class="font-bold text-base">${trip.title}</h3>
            <button onclick="deleteTrip(${trip.id})" class="text-xs bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded transition">Elimina Trasferta</button>
          </div>
          <div class="p-4 space-y-3">
            ${listHtml}
            <div class="pt-3 border-t flex justify-between items-center flex-wrap gap-2">
              <button onclick="addExpense(${trip.id})" class="bg-green-600 hover:bg-green-700 text-white text-xs font-semibold px-3 py-1.5 rounded transition">
                + Aggiungi Spesa
              </button>
              <div class="text-right">
                <span class="text-xs text-gray-500 font-semibold uppercase">Da Rimborsare:</span>
                <span class="text-lg font-bold text-blue-600 ml-1">€ ${tripTotal.toFixed(2)}</span>
              </div>
            </div>
          </div>
        `;

        container.appendChild(tripEl);
      });

      document.getElementById('grand-total').innerText = '€ ' + grandTotal.toFixed(2);
      document.getElementById('trip-count').innerText = data.length + ' Trasferte';
    }

    loadDataFromCloud();
  </script>
</body>
</html>
